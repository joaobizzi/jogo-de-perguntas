const $=id=>document.getElementById(id);let custom=[],used=[];try{custom=JSON.parse(localStorage.getItem('customQuestions')||'[]');used=JSON.parse(localStorage.getItem('drawnQuestions152')||'[]')}catch{}let current='';function persist(){try{localStorage.setItem('drawnQuestions152',JSON.stringify(used))}catch{}}function pool(){let all={...groups,Personalizadas:custom};return Object.entries(all).filter(([k])=>$('filter').value==='Todas'||$('filter').value===k).flatMap(([k,v])=>v.map(q=>({k,q})));}function draw(){let p=pool(),left=p.filter(x=>!used.includes(x.q));if(!left.length&&p.length){used=used.filter(q=>!p.some(x=>x.q===q));left=p}if(!left.length){current='';$('question').textContent='Adicione perguntas à sua lista.';$('tag').textContent='';$('count').textContent='0 perguntas';return}let x=left[Math.floor(Math.random()*left.length)];current=x.q;used.push(current);persist();$('tag').textContent=x.k.toUpperCase();$('question').textContent=current;$('count').textContent=`${p.filter(x=>used.includes(x.q)).length} de ${p.length} perguntas`;$('status').textContent=''}$('card').onclick=$('next').onclick=draw;$('filter').onchange=draw;$('reset').onclick=()=>{used=[];draw()};$('copy').onclick=async()=>{if(!current)return;try{await navigator.clipboard.writeText(current);$('status').textContent='Pergunta copiada!'}catch{$('status').textContent='Selecione o texto para copiar.'}};$('share').onclick=()=>{if(current)location.href='https://wa.me/?text='+encodeURIComponent(current)};$('custom').value=custom.join('\n');$('save').onclick=()=>{custom=[...new Set($('custom').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];try{localStorage.setItem('customQuestions',JSON.stringify(custom))}catch{}$('filter').value='Personalizadas';draw()};draw();</script></html>
